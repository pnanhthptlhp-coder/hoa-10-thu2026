<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luyện tập Hóa học 11 - Phân bón vô cơ</title><style>body{font-family:Arial,sans-serif;background:#f3f7fb;color:#182b40;margin:0}main{max-width:850px;margin:28px auto;padding:25px;background:white;border-radius:16px;box-shadow:0 4px 22px #1232}h1{text-align:center;color:#176a65;font-size:25px}.sub{text-align:center;color:#526477}.question{padding:18px 0;border-bottom:1px solid #ddd}.question h3{font-size:17px;line-height:1.5}.option{display:block;padding:10px;margin:7px 0;border:1px solid #d5dfe8;border-radius:8px;cursor:pointer}.option:hover{background:#eff8f6}input{margin-right:10px}.explain{background:#edf7f3;padding:12px;border-radius:8px;margin-top:10px;display:none}button{background:#16796d;color:white;border:0;border-radius:8px;padding:13px 24px;font-weight:bold;cursor:pointer;margin:15px 8px 0 0}button.secondary{background:#61738a}#result{font-size:22px;font-weight:bold;margin-top:18px;color:#146b62}@media(max-width:600px){main{margin:0;padding:16px;border-radius:0}}</style></head><body><main><h1>ĐỀ LUYỆN TẬP CHUYÊN ĐỀ HÓA HỌC 11</h1><p class="sub">Bài 2: PHÂN BÓN VÔ CƠ — 25 câu trắc nghiệm, mỗi câu 1 đáp án đúng</p><div id="quiz"></div><button onclick="grade()">Nộp bài và xem đáp án</button><button class="secondary" onclick="location.reload()">Làm lại</button><div id="result" aria-live="polite"></div></main><script>
const questions=[
['Theo số lượng nguyên tố dinh dưỡng cơ bản N, P, K, loại phân bón nào sau đây được xếp vào nhóm phân bón đơn?',['Phân NPK','Phân ammophos','Phân urea','Phân hỗn hợp NPK 16-16-8'],2,'Urea cung cấp nguyên tố dinh dưỡng chính là nitrogen.'],
['Nhóm nào sau đây chỉ gồm các nguyên tố dinh dưỡng đa lượng cơ bản của cây trồng?',['N, P, K','Ca, Mg, S','Fe, Zn, Cu','B, Mo, Cl'],0,'N, P, K là ba nguyên tố dinh dưỡng đa lượng cơ bản.'],
['Nguyên tố nào có vai trò quan trọng trong sự hình thành ATP, phát triển bộ rễ và thúc đẩy ra hoa, kết quả?',['Potassium','Phosphorus','Nitrogen','Iron'],1,'Phosphorus tham gia cấu tạo ATP, hỗ trợ rễ, hoa và quả.'],
['Nguyên tố nào giúp thúc đẩy quá trình tạo đường, tinh bột và tăng khả năng chống chịu của cây trồng?',['Nitrogen','Calcium','Potassium','Phosphorus'],2,'Potassium góp phần vào chuyển hóa và sức chống chịu của cây.'],
['Nhóm nào sau đây chỉ gồm các nguyên tố dinh dưỡng vi lượng?',['N, P, K','Ca, Mg, S','N, Fe, K','Fe, Zn, Cu, B'],3,'Fe, Zn, Cu, B thuộc nhóm vi lượng.'],
['Loại phân bón nào sau đây cung cấp đồng thời nitrogen và phosphorus?',['KCl','NH₄H₂PO₄','CO(NH₂)₂','NH₄NO₃'],1,'NH₄H₂PO₄ chứa cả N và P.'],
['Trong sản xuất ammonium sulfate bằng phương pháp trung hòa trực tiếp, cặp nguyên liệu được sử dụng là',['NH₃ và H₂SO₄','NH₃ và HCl','NH₃ và HNO₃','NH₃ và H₃PO₄'],0,'2NH₃ + H₂SO₄ → (NH₄)₂SO₄.'],
['Công thức hóa học của phân urea là',['NH₄NO₃','(NH₄)₂SO₄','CO(NH₂)₂','NH₄Cl'],2,'Urea có công thức CO(NH₂)₂.'],
['Sản phẩm chính chứa phosphorus trong phân superphosphate đơn là',['Ca₃(PO₄)₂','Ca(H₂PO₄)₂','CaHPO₄','H₃PO₄'],1,'Superphosphate đơn chứa Ca(H₂PO₄)₂ cùng CaSO₄.'],
['Phản ứng nào mô tả đúng quá trình sản xuất superphosphate đơn?',['Ca₃(PO₄)₂ + 2H₂SO₄ → Ca(H₂PO₄)₂ + 2CaSO₄','Ca₃(PO₄)₂ + H₂SO₄ → 3CaSO₄ + 2H₃PO₄','Ca₃(PO₄)₂ + 4H₃PO₄ → 3Ca(H₂PO₄)₂','CaCO₃ + H₃PO₄ → Ca₃(PO₄)₂ + CO₂'],0,'Phương trình đúng có hệ số 2 trước CaSO₄.'],
['Trong quy trình sản xuất superphosphate kép, acid nào được tạo ra ở giai đoạn đầu rồi tiếp tục phản ứng với quặng phosphate?',['HNO₃','HCl','H₂CO₃','H₃PO₄'],3,'Giai đoạn đầu tạo H₃PO₄.'],
['Loại phân bón nào thường được sử dụng để cung cấp potassium cho cây trồng?',['KCl','NH₄NO₃','Ca(H₂PO₄)₂','CO(NH₂)₂'],0,'KCl là phân kali thông dụng.'],
['Một bao phân NPK ghi 16-16-8. Ba số này lần lượt biểu thị phần trăm khối lượng của',['N, P, K nguyên chất','NH₃, P₂O₅, KCl','N, P₂O₅, K₂O','N₂, P₂O₃, K₂O₂'],2,'NPK ghi theo N, P₂O₅, K₂O.'],
['Hàm lượng nitrogen trong urea tinh khiết gần nhất với giá trị nào? (N=14, C=12, O=16, H=1)',['35,0%','46,7%','28,0%','60,0%'],1,'28/60 × 100% ≈ 46,7%.'],
['Trong 100 kg phân NPK 16-16-8, khối lượng nitrogen theo nhãn là',['8 kg','12 kg','16 kg','32 kg'],2,'100 × 16% = 16 kg.'],
['Hàm lượng nitrogen trong (NH₄)₂SO₄ tinh khiết gần nhất với giá trị nào? (N=14, H=1, S=32, O=16)',['21,2%','35,0%','46,7%','28,0%'],0,'28/132 × 100% ≈ 21,2%.'],
['Để điều chế 132 kg (NH₄)₂SO₄ bằng NH₃ và H₂SO₄ với hiệu suất 100%, cần ít nhất bao nhiêu NH₃?',['17 kg','68 kg','51 kg','34 kg'],3,'132 kg muối cần 34 kg NH₃.'],
['Để sản xuất superphosphate đơn từ 310 kg Ca₃(PO₄)₂ tinh khiết, khối lượng H₂SO₄ nguyên chất cần dùng (hiệu suất 100%) là',['98 kg','196 kg','294 kg','392 kg'],1,'310 kg Ca₃(PO₄)₂ cần 196 kg H₂SO₄.'],
['Phân bón chứa 35% nitrogen theo khối lượng. Để cung cấp 14 kg nitrogen cần bao nhiêu phân?',['35 kg','45 kg','40 kg','49 kg'],2,'14/0,35 = 40 kg.'],
['Vì sao phân bón vô cơ cần bảo quản trong bao bì kín và nơi khô ráo?',['Hạn chế hút ẩm, vón cục và biến đổi chất lượng','Tăng hàm lượng dinh dưỡng','Chuyển phân đơn thành phân hỗn hợp','Tăng tốc độ hòa tan khi bảo quản'],0,'Tránh hút ẩm và suy giảm chất lượng.'],
['Phân nào cần đặc biệt tránh nhiệt độ cao và vật liệu dễ cháy khi bảo quản?',['KCl','CaSO₄','CaCO₃','NH₄NO₃'],3,'Ammonium nitrate có tính oxi hóa.'],
['Hiện tượng phú dưỡng ở ao, hồ thường bắt đầu do',['Thiếu hoàn toàn phosphorus','Dư thừa hợp chất nitrogen và phosphorus','Oxygen hòa tan tăng liên tục','Không có chất dinh dưỡng'],1,'Dư thừa N và P kích thích tảo phát triển.'],
['Sau khi lượng lớn phân bón rửa trôi xuống hồ, nguyên nhân nào có thể dẫn đến cá chết hàng loạt?',['Nước trong và giàu oxygen','Chất dinh dưỡng giảm về không','Tảo phát triển, phân hủy làm giảm oxygen hòa tan','Toàn bộ dinh dưỡng biến thành nitrogen khí'],2,'Phân hủy tảo làm tiêu thụ oxygen hòa tan.'],
['Biện pháp nào phù hợp nhất để giảm ô nhiễm nguồn nước do phân bón?',['Bón càng nhiều càng tốt','Bón trước mưa lớn','Tăng phân khi đất đã đủ dinh dưỡng','Bón đúng loại, liều lượng và thời điểm'],3,'Bón hợp lý giúp giảm rửa trôi.'],
['Khi AI cung cấp một phương trình sản xuất phân bón chưa cân bằng, học sinh nên',['Kiểm tra, cân bằng và đối chiếu SGK hoặc nguồn đáng tin cậy','Tin AI tuyệt đối','Bỏ qua SGK','Chỉ xem lượt thích'],0,'Cần kiểm chứng thông tin AI.']
];
const letters=['A','B','C','D'];document.getElementById('quiz').innerHTML=questions.map((q,i)=>`<section class="question"><h3><b>Câu ${i+1}.</b> ${q[0]}</h3>${q[1].map((a,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}"><b>${letters[j]}.</b> ${a}</label>`).join('')}<div class="explain" id="e${i}"></div></section>`).join('');
function grade(){let score=0,done=0;questions.forEach((q,i)=>{const choice=document.querySelector(`input[name=q${i}]:checked`);if(choice){done++;if(+choice.value===q[2])score++}const el=document.getElementById('e'+i);el.style.display='block';el.innerHTML=`<b>Đáp án: ${letters[q[2]]}.</b> ${q[3]}`;document.querySelectorAll(`input[name=q${i}]`).forEach(x=>x.disabled=true)});document.getElementById('result').textContent=`Kết quả: ${score}/25 câu đúng (${(score*0.4).toFixed(1)}/10 điểm). Đã trả lời ${done}/25 câu.`;window.scrollTo({top:0,behavior:'smooth'})}
</script></body></html>
